version: '3.8'

services:
  web:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # Optional: run updater on a schedule inside Docker
  # Or use host cron (recommended on homelab)
  updater:
    image: python:3.12-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "apk add --no-cache python3 && python3 scripts/update_data.py && sleep infinity"
    profiles: ["updater"]
